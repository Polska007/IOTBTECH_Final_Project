---
# Playbook: install and start Docker on the managed node(s), then test it.
- name: Configure managed nodes with Docker
  hosts: managed
  become: true

  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install Docker and the Python Docker SDK (used by Ansible's docker module)
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present

    - name: Start Docker and enable it on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Allow the ubuntu user to run docker without sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Check the Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Show the Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Run the hello-world test container
      ansible.builtin.command: docker run --rm hello-world
      register: hello
      changed_when: false

    - name: Run an nginx container on port 80
      community.docker.docker_container:
        name: web-test
        image: nginx:stable
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"

    - name: Verify the server answers HTTP 200
      ansible.builtin.uri:
        url: http://localhost:80
        status_code: 200
      register: result
      retries: 5
      delay: 3
      until: result.status == 200
